<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 100" width="150" height="50" role="img" aria-label="Logotipo provisório Cervejaria Artesanal">
  <!-- Ícone Vetorial Original: Flor de Lúpulo / Gota de Malte -->
  <g transform="translate(15, 14)">
    <!-- Base do emblema -->
    <rect x="0" y="0" width="72" height="72" rx="18" fill="#111315" />
    <!-- Pétalas do lúpulo em Âmbar -->
    <path d="M36 14 C26 24, 24 38, 36 48 C48 38, 46 24, 36 14 Z" fill="#E08A2B" />
    <path d="M22 28 C16 38, 20 50, 32 54 C30 42, 28 34, 22 28 Z" fill="#F09D3E" opacity="0.85" />
    <path d="M50 28 C56 38, 52 50, 40 54 C42 42, 44 34, 50 28 Z" fill="#F09D3E" opacity="0.85" />
    <!-- Detalhe central -->
    <circle cx="36" cy="57" r="3.5" fill="#F7F5F0" />
  </g>

  <!-- Espaço reservado para o Nome da Cervejaria -->
  <g transform="translate(102, 45)">
    <text x="0" y="0" font-family="&#39;Outfit&#39;, &#39;Segoe UI&#39;, sans-serif" font-size="24" font-weight="800" fill="#111315" letter-spacing="0.5">
      CERVEJARIA
    </text>
    <text x="2" y="22" font-family="&#39;Plus Jakarta Sans&#39;, &#39;Segoe UI&#39;, sans-serif" font-size="12" font-weight="700" fill="#8F510A" letter-spacing="3.5">
      ARTESANAL • PR
    </text>
  </g>
</svg>